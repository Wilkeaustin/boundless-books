<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Sign Up | Boundless Books</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
	<div th:replace="~{fragments :: nav}"></div>
	<main class="container py-5">

		<div class="row justify-content-center">

			<div class="col-6">

				<section class="border rounded p-4">
					<p class="eyebrow">JOIN THE COMMUNITY</p>
					<h1>Create an account</h1>
					<div class="alert alert-danger" th:if="${registrationError}" th:text="${registrationError}"></div>
					<form th:action="@{/register}" th:object="${user}" method="post">
						<div class="row">
							<div class="col-md-6"><label class="form-label">First name</label><input
									class="form-control" th:field="*{firstName}"><small class="text-danger"
									th:errors="*{firstName}"></small></div>
							<div class="col-md-6"><label class="form-label">Last name</label><input class="form-control"
									th:field="*{lastName}"><small class="text-danger" th:errors="*{lastName}"></small>
							</div>
						</div><label class="form-label mt-3">Email</label><input class="form-control" type="email"
							th:field="*{email}"><small class="text-danger" th:errors="*{email}"></small><label
							class="form-label mt-3">Username</label><input class="form-control"
							th:field="*{username}"><small class="text-danger" th:errors="*{username}"></small><label
							class="form-label mt-3">Password</label><input class="form-control" type="password"
							th:field="*{password}"><small class="text-danger" th:errors="*{password}"></small><button
							class="btn btn-primary w-100 mt-4">Sign up</button>
					</form>
					<p class="text-center mt-4 mb-0">Already registered? <a th:href="@{/login}">Log in</a></p>
				</section>

			</div>

		</div>

	</main>
</body>

</html>
