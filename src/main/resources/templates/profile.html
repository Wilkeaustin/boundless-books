<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Profile | Boundless Books</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
	<div th:replace="~{fragments :: nav}"></div>
	<main class="container py-5">
		<div class="profile-header">
			<div class="avatar"
				th:text="${#strings.substring(user.firstName,0,1) + #strings.substring(user.lastName,0,1)}">AW</div>
			<div>
				<p class="eyebrow mb-1">MY ACCOUNT</p>
				<h1 class="mb-1" th:text="${user.firstName + ' ' + user.lastName}"></h1>
				<p class="mb-0" th:text="'@' + ${user.username}"></p>
			</div>
		</div>
		<div class="row g-4 mt-2">
			<section class="col-lg-4">
				<div class="info-card">
					<h2>Account details</h2>
					<p><strong>Email</strong><br><span th:text="${user.email}"></span></p>
					<p><strong>Username</strong><br><span th:text="${user.username}"></span></p>
				</div>
			</section>
			<section class="col-lg-8">
				<h2>Your reviews</h2>
				<div class="empty-reviews" th:if="${#lists.isEmpty(reviews)}">You have not reviewed any books yet. <a
						th:href="@{/}">Browse the collection</a>.</div>
				<article class="review-card" th:each="review : ${reviews}">
					<div class="d-flex justify-content-between"><a class="fw-bold"
							th:href="@{/books/{id}(id=${review.book.id})}" th:text="${review.book.title}"></a><span
							class="stars" th:text="${review.rating + ' ★'}"></span></div>
					<p th:text="${review.reviewText}"></p><small
						th:text="${#temporals.format(review.reviewDate,'MMM d, yyyy')}"></small>
				</article>
			</section>
		</div>
	</main>
	<div th:replace="~{fragments :: footer}"></div>
</body>

</html>
