<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Login | Boundless Books</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
	<div th:replace="~{fragments :: nav}"></div>

	<main class="container py-5">

		<div class="row justify-content-center">

			<div class="col-6">

				<div class="border rounded p-4">

					<p class="text-muted mb-2">WELCOME BACK</p>

					<h1>Log in</h1>

					<p class="text-muted">
						Continue exploring and reviewing books.
					</p>

					<div class="alert alert-success" th:if="${param.registered}">
						Account created. You can now log in.
					</div>

					<div class="alert alert-danger" th:if="${param.error}">
						The username or password was incorrect.
					</div>

					<div class="alert alert-info" th:if="${param.logout}">
						You have been logged out.
					</div>

					<form th:action="@{/login}" method="post">

						<div class="mb-3">
							<label class="form-label">
								Username
							</label>

							<input class="form-control" name="username" required>
						</div>

						<div class="mb-3">
							<label class="form-label">
								Password
							</label>

							<input class="form-control" type="password" name="password" required>
						</div>

						<button class="btn btn-primary w-100">
							Log in
						</button>

					</form>

					<p class="text-center mt-4 mb-0">
						New reader?
						<a th:href="@{/register}">
							Create an account
						</a>
					</p>

				</div>

			</div>

		</div>

	</main>
</body>

</html>
