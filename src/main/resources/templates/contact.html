<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Contact | Boundless Books</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
	<div th:replace="~{fragments :: nav}"></div>
	<main class="container content-page">
		<div class="row justify-content-center">
			<div class="col-lg-7">
				<h1>Contact Boundless Books</h1>
				<p class="lead">Have a book suggestion or a question about the website? Send us a message.</p>
				<div class="info-card mt-4">
					<form><label class="form-label">Name</label><input class="form-control mb-3"><label
							class="form-label">Email</label><input type="email" class="form-control mb-3"><label
							class="form-label">Message</label><textarea class="form-control mb-3"
							rows="5"></textarea><button type="button" class="btn btn-primary">Send
							Message</button></form>
				</div>
			</div>
		</div>
	</main>
	<div th:replace="~{fragments :: footer}"></div>
</body>

</html>
