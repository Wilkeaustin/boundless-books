<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Browse | Boundless Books</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
	<div th:replace="~{fragments :: nav}"></div>
	<main class="container home-page">
		<div class="home-heading">
			<div>
				<h1>Browse Books</h1>
				<p>Select a book below to view more information and reader reviews.</p>
			</div>
			<form class="simple-search" method="get" th:action="@{/}"><input class="form-control" name="search"
					th:value="${search}" placeholder="Search title or author"><button
					class="btn btn-primary">Search</button></form>
		</div>
		<div class="simple-genres"><strong>Categories:</strong><a th:href="@{/}">All</a><a
				th:href="@{/(genre='Self-Help')}">Self-Help</a><a th:href="@{/(genre='Fantasy')}">Fantasy</a><a
				th:href="@{/(genre='Science Fiction')}">Science Fiction</a></div>
		<div class="alert alert-info" th:if="${#lists.isEmpty(books)}">No books matched your search.</div>
		<section class="book-list">
			<article class="book-row" th:each="book : ${books}"> <img class="book-cover" th:src="${book.coverImage}"
					th:alt="${book.title + ' cover'}">
				<div class="book-row-info">
					<h2 th:text="${book.title}">Book Title</h2>
					<p class="book-author" th:text="'by ' + ${book.author}">Author</p>
					<p><strong>Genre:</strong> <span th:text="${book.genre}">Genre</span></p>
					<p th:text="${book.description}">Book description</p>
					<div class="book-row-actions"><span class="stars"
							th:text="${book.averageRating > 0 ? #numbers.formatDecimal(book.averageRating,1,1) + ' ★' : 'No ratings yet'}"></span><a
							class="btn btn-primary" th:href="@{/books/{id}(id=${book.id})}">View Details</a></div>
				</div>
			</article>
		</section>
	</main>
	<div th:replace="~{fragments :: footer}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
