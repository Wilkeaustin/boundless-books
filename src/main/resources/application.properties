spring.application.name=boundless-books
spring.datasource.url=jdbc:mysql://127.0.0.1:8889/boundless_books?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC# REPLACE the two placeholder values below with your MySQL Workbench login.
