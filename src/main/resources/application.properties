spring.application.name=boundless-books

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:8889/boundless_books?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

server.port=${PORT:8080}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{40} - %msg%n